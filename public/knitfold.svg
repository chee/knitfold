<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- knitfold: a cone of yarn, in sepia, on antique linen -->
	<defs>
		<linearGradient id="yarn" x1="0" x2="1">
			<stop offset="0" stop-color="#b58e64"/>
			<stop offset="0.45" stop-color="#d9bc94"/>
			<stop offset="1" stop-color="#a47c55"/>
		</linearGradient>
		<clipPath id="cone">
			<path d="M25 17h14l9.5 35a16.5 4.5 0 0 1-33 0z"/>
		</clipPath>
	</defs>
	<rect width="64" height="64" rx="14" fill="#f1e7d3"/>
	<rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#e3d5bb" stroke-width="2"/>
	<!-- the tube, peeping out of the top -->
	<path d="M28.5 8h7l1 10h-9z" fill="#c9ad86" stroke="#7d6047" stroke-width="1.5" stroke-linejoin="round"/>
	<ellipse cx="32" cy="8" rx="3.5" ry="1.2" fill="#9c7d5e"/>
	<!-- the yarn wound on it -->
	<path d="M25 17h14l9.5 35a16.5 4.5 0 0 1-33 0z" fill="url(#yarn)"/>
	<g clip-path="url(#cone)" fill="none" stroke="#8d6b4b" stroke-width="1" stroke-opacity="0.45">
		<path d="M10 24q22 5 44 0M10 31q22 5 44 0M10 38q22 5 44 0M10 45q22 5 44 0"/>
		<path d="M14 22 50 34M14 34 50 46" stroke-opacity="0.25"/>
	</g>
	<path d="M25 17h14l9.5 35a16.5 4.5 0 0 1-33 0z" fill="none" stroke="#7d6047" stroke-width="1.5" stroke-linejoin="round"/>
	<ellipse cx="32" cy="17" rx="7" ry="1.6" fill="#e3caa4" stroke="#7d6047" stroke-width="1.2"/>
	<!-- its loose end -->
	<path d="M47 44c5 2 8 6 6 11" fill="none" stroke="#a47c55" stroke-width="1.6" stroke-linecap="round"/>
</svg>
