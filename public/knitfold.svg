<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- a cone of antique-linen yarn on knitfold's paper: its kraft tube
	     peeking out the top, the winding in soft hairlines, and a loose end
	     of riso-rose thread wandering off -->
	<defs>
		<linearGradient id="yarn" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="#e6d1b6"/>
			<stop offset="0.45" stop-color="#faebd7"/>
			<stop offset="1" stop-color="#e0c9ac"/>
		</linearGradient>
		<linearGradient id="tube" x1="0" x2="1" y1="0" y2="0">
			<stop offset="0" stop-color="#c9a67d"/>
			<stop offset="0.5" stop-color="#dfc29b"/>
			<stop offset="1" stop-color="#c29e74"/>
		</linearGradient>
		<clipPath id="cone">
			<path d="M24 20 14 50a18 4.5 0 0 0 36 0L40 20Z"/>
		</clipPath>
	</defs>
	<rect width="64" height="64" rx="14" fill="#fcf7f2"/>
	<rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" fill="none" stroke="#e3d6d8" stroke-width="1.5"/>
	<g stroke="#5f5367" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
		<!-- the yarn, and the top of its winding -->
		<path d="M24 20 14 50a18 4.5 0 0 0 36 0L40 20" fill="url(#yarn)"/>
		<ellipse cx="32" cy="20" rx="8" ry="2.4" fill="#f1dfc6"/>
		<g clip-path="url(#cone)" fill="none" stroke="#c9ab88" stroke-width="1.2">
			<path d="M20 29c4 2.4 20 2.4 24 0"/>
			<path d="M18 36c5 2.8 23 2.8 28 0"/>
			<path d="M16.5 43c6 3 25 3 31 0"/>
		</g>
		<!-- the tube, coming up out of it -->
		<path d="M28.5 9 27.5 20a4.5 1.3 0 0 0 9 0L35.5 9Z" fill="url(#tube)"/>
		<ellipse cx="32" cy="9" rx="3.5" ry="1.2" fill="#9c7a55"/>
		<!-- the loose end -->
		<path d="M46.2 37c3.2.4 4.6 2.8 4 6s-.4 5.6 3.6 7.6" fill="none" stroke="#c8336c" stroke-opacity="0.75"/>
	</g>
</svg>
